name: Release

# Build and publish release archives whenever a version tag is pushed.
# Tag and push to trigger, for example:
#   git tag v1.1.0
#   git push origin v1.1.0

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build native ASPEED decoder
        shell: pwsh
        run: ./src/ATENtion.Aspeed.Native/build-windows.ps1

      - name: Build (Release)
        run: dotnet build ATENtion.slnx -c Release

      - name: Smoke-test native ASPEED decoder
        shell: pwsh
        run: ./src/ATENtion.Capture/bin/Release/net48/ATENtion.Capture.exe --check-native-decoder

      - name: Package Windows GUI and CLI
        shell: pwsh
        run: |
          $stage = "release-win"
          New-Item -ItemType Directory -Path $stage | Out-Null
          $outputs = @(
            "src/ATENtion.App/bin/Release/net48",
            "src/ATENtion.Capture/bin/Release/net48"
          )
          foreach ($out in $outputs) {
            Get-ChildItem $out -File |
              Where-Object { $_.Extension -ne '.pdb' } |
              Copy-Item -Destination $stage -Force
          }
          $zip = "ATENtion-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: ATENtion-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error

  portable-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            rid: linux-x64
            native: libaspeed_codec.so
          - runner: macos-15-intel
            rid: osx-x64
            native: libaspeed_codec.dylib
          - runner: macos-15
            rid: osx-arm64
            native: libaspeed_codec.dylib

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build native ASPEED decoder (Linux)
        if: runner.os == 'Linux'
        run: |
          cc -shared -fPIC -O2 -std=c11 \
            -o src/ATENtion.Aspeed.Native/${{ matrix.native }} \
            src/ATENtion.Aspeed.Native/decoder.c

      - name: Build native ASPEED decoder (macOS)
        if: runner.os == 'macOS'
        run: |
          cc -dynamiclib -O2 -std=c11 \
            -o src/ATENtion.Aspeed.Native/${{ matrix.native }} \
            src/ATENtion.Aspeed.Native/decoder.c

      - name: Publish self-contained CLI
        run: |
          native_path="${{ github.workspace }}/src/ATENtion.Aspeed.Native/${{ matrix.native }}"
          dotnet publish src/ATENtion.Capture/ATENtion.Capture.csproj \
            -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:AspeedNativeLibrary="$native_path" \
            -p:AspeedNativeLibraryName=${{ matrix.native }}
          publish_dir="src/ATENtion.Capture/bin/Release/net8.0/${{ matrix.rid }}/publish"
          "$publish_dir/ATENtion.Capture" --help
          "$publish_dir/ATENtion.Capture" --check-native-decoder
          test -f "$publish_dir/ASPEED-CODEC-LICENSE.txt"
          test "$(find "$publish_dir" -maxdepth 1 -type f | wc -l | xargs)" -eq 2

      - name: Package CLI
        run: |
          publish_dir="src/ATENtion.Capture/bin/Release/net8.0/${{ matrix.rid }}/publish"
          archive="ATENtion-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz"
          tar -czf "$archive" -C "$publish_dir" .

      - name: Upload CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: ATENtion-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

  release:
    needs: [ windows, portable-cli ]
    runs-on: ubuntu-latest

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$repo"
          else
            gh release create "$tag" release-assets/* \
              --repo "$repo" --title "$tag" --generate-notes
          fi
