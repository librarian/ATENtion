name: macOS CI

# Explicitly requested checks; never a dependency of normal CI.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, SHA, or refs/pull/NUMBER/head to test (blank uses selected branch)'
        type: string
        required: false

permissions:
  contents: read

jobs:
  portable-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            native: libaspeed_codec.dylib
          - runner: macos-15
            rid: osx-arm64
            native: libaspeed_codec.dylib

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build native ASPEED decoder (macOS)
        run: |
          cc -dynamiclib -O2 -std=c11 \
            -o src/ATENtion.Aspeed.Native/${{ matrix.native }} \
            src/ATENtion.Aspeed.Native/decoder.c

      - name: Test portable core
        run: dotnet test tests/ATENtion.Tests/ATENtion.Tests.csproj -c Release -f net8.0

      - name: Publish and smoke-test CLI
        run: |
          native_path="${{ github.workspace }}/src/ATENtion.Aspeed.Native/${{ matrix.native }}"
          dotnet publish src/ATENtion.Capture/ATENtion.Capture.csproj \
            -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:AspeedNativeLibrary="$native_path" \
            -p:AspeedNativeLibraryName=${{ matrix.native }}
          publish_dir="src/ATENtion.Capture/bin/Release/net8.0/${{ matrix.rid }}/publish"
          "$publish_dir/ATENtion.Capture" --help
          "$publish_dir/ATENtion.Capture" --check-native-decoder
          test -f "$publish_dir/ASPEED-CODEC-LICENSE.txt"
          test "$(find "$publish_dir" -maxdepth 1 -type f | wc -l | xargs)" -eq 2
