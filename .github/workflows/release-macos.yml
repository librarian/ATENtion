name: macOS Release

# Windows/Linux publish first; macOS availability cannot block them.
# workflow_run also works when Release publishes with GITHUB_TOKEN.
on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build or retry (for example v1.2.0)'
        type: string
        required: true

permissions:
  contents: write

jobs:
  portable-cli:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            rid: osx-x64
            native: libaspeed_codec.dylib
          - runner: macos-15
            rid: osx-arm64
            native: libaspeed_codec.dylib

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Verify existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          [[ "$RELEASE_TAG" == v* ]] || { echo 'Expected a version tag starting with v'; exit 1; }
          gh release view "$RELEASE_TAG"

      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Verify automatic release commit
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Build native ASPEED decoder (macOS)
        run: |
          cc -dynamiclib -O2 -std=c11 \
            -o src/ATENtion.Aspeed.Native/${{ matrix.native }} \
            src/ATENtion.Aspeed.Native/decoder.c

      - name: Publish self-contained CLI
        run: |
          native_path="${{ github.workspace }}/src/ATENtion.Aspeed.Native/${{ matrix.native }}"
          dotnet publish src/ATENtion.Capture/ATENtion.Capture.csproj \
            -c Release -f net8.0 -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:DebugSymbols=false \
            -p:AspeedNativeLibrary="$native_path" \
            -p:AspeedNativeLibraryName=${{ matrix.native }}
          publish_dir="src/ATENtion.Capture/bin/Release/net8.0/${{ matrix.rid }}/publish"
          "$publish_dir/ATENtion.Capture" --help
          "$publish_dir/ATENtion.Capture" --check-native-decoder
          test -f "$publish_dir/ASPEED-CODEC-LICENSE.txt"
          test "$(find "$publish_dir" -maxdepth 1 -type f | wc -l | xargs)" -eq 2

      - name: Package CLI
        run: |
          publish_dir="src/ATENtion.Capture/bin/Release/net8.0/${{ matrix.rid }}/publish"
          archive="ATENtion-${RELEASE_TAG}-${{ matrix.rid }}.tar.gz"
          tar -czf "$archive" -C "$publish_dir" .

      - name: Upload CLI archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: ATENtion-${{ env.RELEASE_TAG }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

      - name: Attach this architecture to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" "ATENtion-${RELEASE_TAG}-${{ matrix.rid }}.tar.gz" --clobber
